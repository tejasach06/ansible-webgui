services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ansible_webgui}
      POSTGRES_USER: ${POSTGRES_USER:-ansible}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ansible_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ansible} -d ${POSTGRES_DB:-ansible_webgui}"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Containerfile.backend
    command: sh -c "until pg_isready -h postgres -U ${POSTGRES_USER:-ansible} -d ${POSTGRES_DB:-ansible_webgui}; do sleep 1; done && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${WEBGUI_TRUSTED_PROXIES:-127.0.0.1}"
    ports:
      - "${WEBGUI_HOST:-127.0.0.1}:${WEBGUI_PORT:-8080}:8000"
    env_file: .env
    volumes:
      - content:/data/content
      - artifacts:/data/artifacts
      - sshdata:/home/runner/.ssh
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Containerfile.backend
    command: celery -A app.tasks.worker worker --loglevel=info -c 4
    env_file: .env
    volumes:
      - content:/data/content
      - artifacts:/data/artifacts
      - sshdata:/home/runner/.ssh
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: .
      dockerfile: Containerfile.backend
    command: celery -A app.tasks.worker beat -S redbeat.RedBeatScheduler --loglevel=info
    env_file: .env
    volumes:
      - content:/data/content
      - artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis


  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Containerfile.backend
      target: tests
    command: pytest -q
    env_file: .env
    volumes:
      - ./backend:/app
      - content:/data/content
      - artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  content:
  artifacts:
  sshdata:
