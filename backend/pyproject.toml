[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansible-webgui-backend"
version = "0.1.0"
description = "Ansible WebGUI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "celery==5.4.0",
    "celery-redbeat==2.2.0",
    "redis==5.2.1",
    "sqlalchemy==2.0.38",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "gitpython==3.1.58",
    "argon2-cffi==23.1.0",
    "pyjwt==2.13.0",
    "cryptography==50.0.0",
    "ansible-core==2.16.19",
    "ansible-lint==24.12.2",
    "ansible-runner==2.4.0",
    "ruamel.yaml==0.18.10",
    "croniter==6.0.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pip-audit==2.8.0",
    "ruff==0.8.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "error",
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning",
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
cache-dir = "/tmp/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4", "ARG"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
