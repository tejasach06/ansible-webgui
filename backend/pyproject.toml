[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansible-webgui-backend"
version = "0.1.0"
description = "Ansible WebGUI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "celery==5.4.0",
    "celery-redbeat==2.2.0",
    "redis==5.2.1",
    "sqlalchemy==2.0.38",
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "gitpython==3.1.44",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    "cryptography==44.0.1",
    "ansible-core==2.16.14",
    "ansible-lint==24.12.2",
    "ansible-runner==2.4.0",
    "ruamel.yaml==0.18.10",
    "croniter==6.0.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pip-audit==2.8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
